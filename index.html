<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/images/favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ailynangeles</title>
    <!-- Set the theme before first paint so the page never flashes the wrong one. -->
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const system = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
        document.documentElement.dataset.theme = saved || system;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="Ailyn Angeles — Senior Front-End Engineer with 10 years of experience building web and mobile apps with React, React Native and TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ailynangeles" />
    <meta
      property="og:description"
      content="Senior Front-End Engineer with 10 years of experience building web and mobile apps with React, React Native and TypeScript."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=National+Park:wght@400..700&family=Roboto:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
